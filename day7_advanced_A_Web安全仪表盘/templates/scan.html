<!DOCTYPE html>
<html lang="zh-CN" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <title>扫描中心 - Security Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.min.js"></script>
    <style>
        body { background: #0a101c; color: #e0e0e0; }
        .navbar { background: #111827; border-bottom: 1px solid #1e3a5f; }
        .navbar-brand { color: #00d4aa !important; font-weight: bold; }
        .card { background: #111827; border: 1px solid #1e3a5f; border-radius: 10px; cursor: pointer; transition: all 0.3s; }
        .card:hover { border-color: #00d4aa; transform: translateY(-2px); }
        .scan-icon { font-size: 48px; text-align: center; margin: 10px 0; }
        .scan-title { color: #00d4aa; font-size: 18px; font-weight: bold; text-align: center; }
        .scan-desc { color: #8c9db5; font-size: 13px; text-align: center; }
        .result-box { background: #1a2332; border-radius: 8px; padding: 15px; margin-top: 15px; font-family: monospace; font-size: 13px; max-height: 400px; overflow-y: auto; }
        .progress-bar-container { display: none; margin: 15px 0; }
        .btn-scan { background: #00d4aa; color: #0a101c; font-weight: bold; border: none; border-radius: 6px; padding: 8px 20px; }
        .btn-scan:hover { background: #00b894; }
        .severity-HIGH { color: #da3633; } .severity-MEDIUM { color: #d29a22; }
        .severity-LOW { color: #2ea043; } .severity-INFO { color: #58a6ff; }
    </style>
</head>
<body>
    <nav class="navbar navbar-dark">
        <div class="container-fluid">
            <span class="navbar-brand">🛡️ Security Dashboard</span>
            <a href="/" class="btn btn-outline-success btn-sm">返回仪表盘</a>
        </div>
    </nav>

    <div class="container mt-4">
        <h4 style="color:#00d4aa">🔍 扫描中心</h4>
        <p class="text-secondary">选择扫描类型，输入目标，一键启动安全扫描</p>

        <div class="row mb-4">
            <div class="col-md-3 mb-3">
                <div class="card p-3" onclick="selectScan('port')">
                    <div class="scan-icon">🔌</div>
                    <div class="scan-title">端口扫描</div>
                    <div class="scan-desc">TCP Connect 扫描<br>检测开放端口和服务</div>
                </div>
            </div>
            <div class="col-md-3 mb-3">
                <div class="card p-3" onclick="selectScan('web')">
                    <div class="scan-icon">🌐</div>
                    <div class="scan-title">Web 漏洞扫描</div>
                    <div class="scan-desc">信息收集 + 目录扫描<br>+ XSS/SQLi 检测</div>
                </div>
            </div>
            <div class="col-md-3 mb-3">
                <div class="card p-3" onclick="selectScan('logs')">
                    <div class="scan-icon">📊</div>
                    <div class="scan-title">日志分析</div>
                    <div class="scan-desc">暴力破解检测<br>异常登录分析</div>
                </div>
            </div>
            <div class="col-md-3 mb-3">
                <div class="card p-3" onclick="selectScan('ids')">
                    <div class="scan-icon">🛡️</div>
                    <div class="scan-title">入侵检测</div>
                    <div class="scan-desc">SQL注入/XSS/命令注入<br>攻击模式匹配</div>
                </div>
            </div>
        </div>

        <!-- 扫描输入 -->
        <div class="card p-4" id="scanForm" style="display:none">
            <h5 id="scanTypeTitle" style="color:#00d4aa"></h5>
            <div class="row mt-3">
                <div class="col-md-8">
                    <input type="text" id="scanTarget" class="form-control bg-dark text-white border-secondary"
                           placeholder="输入目标 (IP/URL/文件路径)">
                </div>
                <div class="col-md-4">
                    <button class="btn btn-scan" onclick="startScan()">🚀 开始扫描</button>
                </div>
            </div>
            <div class="progress-bar-container" id="progressBar">
                <div class="progress" style="height:6px">
                    <div class="progress-bar bg-success progress-bar-striped progress-bar-animated" style="width:100%"></div>
                </div>
                <small class="text-secondary">扫描中...</small>
            </div>
            <div class="result-box" id="resultBox" style="display:none"></div>
        </div>
    </div>

    <script>
        const socket = io();
        let currentScanType = '';

        function selectScan(type) {
            currentScanType = type;
            const titles = {port:'🔌 端口扫描', web:'🌐 Web漏洞扫描', logs:'📊 日志分析', ids:'🛡️ 入侵检测'};
            const placeholders = {port:'输入IP地址 (如 127.0.0.1)', web:'输入URL (如 http://example.com)', logs:'输入日志文件路径 (如 /var/log/auth.log)', ids:'输入待检测的日志内容'};
            document.getElementById('scanTypeTitle').textContent = titles[type];
            document.getElementById('scanTarget').placeholder = placeholders[type];
            document.getElementById('scanForm').style.display = 'block';
            document.getElementById('resultBox').style.display = 'none';
            document.getElementById('progressBar').style.display = 'none';
        }

        function startScan() {
            const target = document.getElementById('scanTarget').value;
            if (!target) { alert('请输入目标'); return; }

            document.getElementById('progressBar').style.display = 'block';
            document.getElementById('resultBox').style.display = 'none';

            fetch('/api/scan/' + currentScanType, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({target: target, log_file: target})
            });
        }

        socket.on('scan_result', function(data) {
            document.getElementById('progressBar').style.display = 'none';
            const box = document.getElementById('resultBox');
            box.style.display = 'block';

            if (data.result.error) {
                box.innerHTML = '<span class="severity-HIGH">ERROR: ' + data.result.error + '</span>';
                return;
            }

            let html = '';
            const r = data.result;
            if (data.type === 'port') {
                html += '<div style="color:#00d4aa">=== 端口扫描结果 ===</div>';
                html += '目标: ' + r.target + ' | 扫描端口: ' + r.total_ports + ' | 开放: ' + r.open_ports + '\n\n';
                r.results.forEach(function(p) {
                    html += '<span class="severity-HIGH">PORT ' + p.port + '</span>  ' + p.service + '  ' + p.state;
                    if (p.banner) html += '  (' + p.banner + ')';
                    html += '\n';
                });
            } else if (data.type === 'web') {
                html += '<div style="color:#00d4aa">=== Web扫描结果 ===</div>';
                html += '目标: ' + r.target + ' | 发现: ' + r.total_findings + '\n\n';
                r.findings.forEach(function(f) {
                    html += '<span class="severity-' + f.severity + '">[' + f.severity + ']</span> ' + f.category + ': ' + f.detail + '\n';
                });
            } else if (data.type === 'logs') {
                html += '<div style="color:#00d4aa">=== 日志分析结果 ===</div>';
                html += '登录失败: ' + r.total_failed + ' 次\n';
                html += '暴力破解源: ' + (r.brute_force_alerts ? r.brute_force_alerts.length : 0) + ' 个\n\n';
                if (r.brute_force_alerts) {
                    r.brute_force_alerts.forEach(function(a) {
                        html += '<span class="severity-HIGH">[HIGH]</span> IP: ' + a.ip + '  失败 ' + a.failures + ' 次\n';
                    });
                }
            }
            box.innerHTML = '<pre style="color:#e0e0e0;margin:0">' + html + '</pre>';
        });
    </script>
</body>
</html>
