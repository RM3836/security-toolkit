<!DOCTYPE html>
<html lang="zh-CN" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Security Dashboard - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #0a101c; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        .login-card { background: #111827; border: 1px solid #1e3a5f; border-radius: 12px; padding: 40px; width: 380px; }
        .login-title { color: #00d4aa; font-size: 28px; font-weight: bold; text-align: center; margin-bottom: 30px; }
        .form-control { background: #1a2332; border: 1px solid #2a3a4f; color: #e0e0e0; }
        .form-control:focus { border-color: #00d4aa; box-shadow: 0 0 0 0.2rem rgba(0,212,170,0.25); }
        .btn-login { background: #00d4aa; color: #0a101c; font-weight: bold; width: 100%; border: none; padding: 10px; border-radius: 8px; }
        .btn-login:hover { background: #00b894; }
        .alert { background: #2a1a1a; border: 1px solid #da3633; color: #ff6b6b; }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="login-title">🛡️ Security Dashboard</div>
        {% with messages = get_flashed_messages(with_categories=true) %}
        {% for cat, msg in messages %}
        <div class="alert">{{ msg }}</div>
        {% endfor %}
        {% endwith %}
        <form method="POST">
            <div class="mb-3">
                <label class="form-label text-secondary">用户名</label>
                <input type="text" name="username" class="form-control" placeholder="admin" autofocus>
            </div>
            <div class="mb-3">
                <label class="form-label text-secondary">密码</label>
                <input type="password" name="password" class="form-control" placeholder="••••••">
            </div>
            <button type="submit" class="btn btn-login mt-3">登 录</button>
        </form>
        <p class="text-secondary text-center mt-3" style="font-size:12px">默认账号: admin / admin123</p>
    </div>
</body>
</html>
